# Reusable boot test for the Compose fragments (needs a Docker daemon, so
# GitHub-hosted Linux runners; each fragment alone, then all together).
#   uses: Neoforge-Labs/hephaestus/.github/workflows/compose-boot.yml@v0
name: compose-boot

on:
  workflow_call:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # moon compares against the base branch on a pull_request. A shallow
          # clone has no merge base to resolve, so its git call fails with exit
          # 128 (it only warns on push, where there is no explicit base).
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
      # The merged-stack section makes one tracked run against the booted mlflow
      # fragment and reads its tags back through the REST API, which needs
      # `hephkit.lab` and an mlflow client in an ephemeral environment -- so this
      # job needs uv, which ubuntu-latest does not preinstall. Without it the
      # assertion fails rather than skipping, which is why it is here and not a
      # guard inside the script: a check that quietly skips itself when its
      # interpreter is missing is the one shape this gate may not have.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # keep equal to uv in .prototools
          python-version: '3.12'
      # No apt step. The boot test asks Postgres from inside its own container,
      # which already ships psql, and checks the published host port with a
      # bare TCP connect. Installing postgresql-client from the Ubuntu mirrors
      # put a DNS lookup of azure.archive.ubuntu.com on the critical path of
      # every run, and took the job down when a runner could not resolve it.
      # curl and the aws CLI v2 are preinstalled on ubuntu-latest.
      - name: Boot every fragment
        run: moon run compose:test
