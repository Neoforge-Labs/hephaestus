# Reusable boot test for the Compose fragments (needs a Docker daemon, so
# GitHub-hosted Linux runners; each fragment alone, then all together).
#   uses: Neoforge-Labs/hephaestus/.github/workflows/compose-boot.yml@v0
name: compose-boot

on:
  workflow_call:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # moon compares against the base branch on a pull_request. A shallow
          # clone has no merge base to resolve, so its git call fails with exit
          # 128 (it only warns on push, where there is no explicit base).
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
      # No apt step. The boot test asks Postgres from inside its own container,
      # which already ships psql, and checks the published host port with a
      # bare TCP connect. Installing postgresql-client from the Ubuntu mirrors
      # put a DNS lookup of azure.archive.ubuntu.com on the critical path of
      # every run, and took the job down when a runner could not resolve it.
      # curl and the aws CLI v2 are preinstalled on ubuntu-latest.
      - name: Boot every fragment
        run: moon run compose:test
