# Reusable Python gate for hephkit and the shared repo checks that need its
# environment. Every command is a moon task so CI and a local `moon run` cannot
# drift. Consume as:
#   uses: Neoforge-Labs/hephaestus/.github/workflows/python-ci.yml@v0
name: python-ci

on:
  workflow_call:
    inputs:
      include-slow:
        description: >-
          Also run the slow-marked tests (64 MB payload, 10M-char strings) in a
          separate job. The default job always runs with -m "not slow".
        type: boolean
        default: false
      postgres:
        description: >-
          Run a Postgres service and point HEPH_TEST_DATABASE_URL at it. Needed
          by the idempotency contract suite, which fails rather than skips
          without a database. Off by default: this workflow is consumed by other
          repositories at @v0, and one with no database test should not pull an
          image and wait on pg_isready to find that out.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The idempotency store tests require a real Postgres (they fail, not
      # skip, without one: a skipped test still counts against the coverage
      # gate). Empty unless the caller asked for the service, so a consumer
      # without a database test is never pointed at a server that is not there.
      HEPH_TEST_DATABASE_URL: >-
        ${{ inputs.postgres && 'postgresql://heph:heph@localhost:5432/heph' || '' }}
    services:
      postgres:
        # Conditional service: an empty image does not start the container, which
        # is what the workflow syntax documentation gives for exactly this case
        # (jobs.<job_id>.services.<service_id>.image).
        #
        # Pinned by digest, like every action above, because the floating tag is
        # free to move pg_isready, gen_random_uuid() or a default GUC under the
        # contract suite that ADR 0020 makes every future adapter pass. This is
        # postgres 17.11, the version ADR 0020's measurements were taken on, and
        # it is bumped deliberately -- read the new digest from
        # `docker buildx imagetools inspect postgres:17` and change both jobs --
        # never whenever Docker Hub rebuilds the tag.
        image: >-
          ${{ inputs.postgres && 'postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f' || '' }}
        env:
          POSTGRES_USER: heph
          POSTGRES_PASSWORD: heph
          POSTGRES_DB: heph
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # moon compares against the base branch on a pull_request. A shallow
          # clone has no merge base to resolve, so its git call fails with exit
          # 128 (it only warns on push, where there is no explicit base).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # keep equal to uv in .prototools
          python-version: '3.12'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
      # The pinned toolchain in rust-toolchain.toml is installed by rustup on
      # first use (maturin builds the PyO3 extension).
      - name: Tests, fast path (coverage gate 90%)
        run: moon run hephkit:test-fast
      - name: mypy --strict
        run: moon run hephkit:typecheck
      - name: hephkit-lab tests and mypy --strict
        # Its own job step rather than a second project in the lines above, so a
        # failure names the distribution. The lab spine installs with no
        # scientific stack (ADR 0023), so this adds seconds, not minutes.
        run: moon run hephkit-lab:test-fast hephkit-lab:typecheck
      - name: Generated files are not stale
        run: moon run hephkit:gen-errors hephkit:gen-conventions
      - name: Rust core codes are all in spec/errors.yaml
        run: moon run hephkit:core-codes
      - name: Conformance vectors are valid
        run: moon run conformance:check
      - name: Repo tooling tests
        # rfc8785 is here because test_gen_idempotency_vectors imports the
        # generator to run its --check, and the generator uses the reference
        # canonicaliser. The version is pinned equal to that script's PEP 723
        # header, and tools/tests/test_release_config.py fails if the two drift.
        run: uv run --with pytest --with pyyaml --with jsonschema --with rfc8785==0.1.4 pytest tools/tests -q
      - name: pip-audit
        working-directory: python/hephkit
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict

  python-slow:
    if: ${{ inputs.include-slow }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEPH_TEST_DATABASE_URL: >-
        ${{ inputs.postgres && 'postgresql://heph:heph@localhost:5432/heph' || '' }}
    services:
      postgres:
        # Conditional and digest-pinned for the reasons given on the job above;
        # keep the two digests equal.
        image: >-
          ${{ inputs.postgres && 'postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f' || '' }}
        env:
          POSTGRES_USER: heph
          POSTGRES_PASSWORD: heph
          POSTGRES_DB: heph
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # moon compares against the base branch on a pull_request. A shallow
          # clone has no merge base to resolve, so its git call fails with exit
          # 128 (it only warns on push, where there is no explicit base).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
      - name: Full suite including slow tests
        run: moon run hephkit:test
