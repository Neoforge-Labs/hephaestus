# Ecosystem CI: does a change here still work for what is built from it?
# Runs each consumer at a pinned ref. NO row is enabled yet, and nothing calls
# this workflow yet either: it is `workflow_call` only and ci.yml does not use
# it, so the matrix is a declaration of intent rather than a running gate. That
# is honest about where it stands -- the first row to enable is a product that
# has adopted hephkit, and none has. The repo's own five-minute path is NOT
# that row; it runs in five-minute.yml from ci.yml, because an example we ship
# cannot tell us whether a change still works for someone else.
# An `enabled: false` entry is NOT run: each one emits a visible "skipped"
# notice instead of passing quietly. Flip `enabled`, set a real `ref` and
# `command`, AND add a caller, when a product adopts hephkit.
#
# `workflow_call` ONLY, deliberately. It previously also ran on `schedule` and
# `workflow_dispatch`, and CodeQL flagged that as cache poisoning
# (actions/cache-poisoning/poisonable-step, high): those two triggers run in the
# default branch's context, so the job holds write access to the Actions cache
# while it checks out a third-party repository at `matrix.ref` and runs its
# command. Untrusted code in a cache-writing job on the default branch can
# poison a cache that trusted workflows later restore.
#
# Do NOT add `schedule` or `workflow_dispatch` back to get the weekly run. The
# risk is the combination of untrusted execution and a privileged context, so
# running consumers on a timer needs them executed somewhere other than this
# repository's default-branch context — dispatched into each consumer's own
# repository, for instance. That is a design change, not a trigger.
#   uses: Neoforge-Labs/hephaestus/.github/workflows/ecosystem.yml@v0
name: ecosystem

on:
  workflow_call:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.name }} (${{ matrix.enabled && 'enabled' || 'disabled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tutorial now exists, and it runs -- in five-minute.yml, called
          # from ci.yml, on every push and pull request. This row stays
          # disabled, and deliberately so: nothing calls ecosystem.yml (it is
          # `workflow_call` only and has no caller), so flipping this to true
          # would change no behaviour while looking like it had. More to the
          # point, examples/hello is this repository's own example at its own
          # SHA, not a consumer: the question this matrix exists to ask is
          # whether a change here still works for something built from it, and
          # our own example cannot answer that. The first real row is a product
          # adopting hephkit. Keeping the five-minute path here as well would
          # only run it twice.
          - name: examples/hello
            enabled: false
            repo: Neoforge-Labs/hephaestus
            ref: ${{ github.sha }}
            command: bash examples/hello/tutorial_test.sh
          # Placeholders: before enabling a row, set ref to a 40-hex commit SHA and set
          # command. The placeholder ref cannot resolve, so checkout fails loudly.
          - name: Collie
            enabled: false
            repo: Neoforge-Labs/collie
            ref: TODO-pin-a-commit-sha
            command: ''
          - name: Domus
            enabled: false
            repo: Neoforge-Labs/domus
            ref: TODO-pin-a-commit-sha
            command: ''
          - name: SAWA
            enabled: false
            repo: Neoforge-Labs/sawa
            ref: TODO-pin-a-commit-sha
            command: ''
          - name: NeoRx
            enabled: false
            repo: Neoforge-Labs/neorx
            ref: TODO-pin-a-commit-sha
            command: ''
    steps:
      - name: Skipped, not enabled
        if: ${{ !matrix.enabled }}
        run: echo "::notice title=${{ matrix.name }}::skipped, enabled is false in ecosystem.yml"
      - name: Refuse an enabled row with no command
        if: ${{ matrix.enabled && matrix.command == '' }}
        run: |
          echo "::error::${{ matrix.name }} is enabled but has an empty command"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.enabled }}
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ matrix.enabled }}
        with:
          version: '0.13.6'
          python-version: '3.12'
          # This job checks out a third-party repository at `matrix.ref` and then
          # runs its command. On `workflow_dispatch` and `schedule` it runs in the
          # default branch's context, so it holds write access to the Actions
          # cache. A cache keyed on files from an untrusted checkout lets that
          # checkout poison a cache which trusted default-branch workflows later
          # restore, so this job must never write one. Do not set this to `true`
          # to speed the row up.
          enable-cache: false
      - name: Run
        if: ${{ matrix.enabled }}
        env:
          COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$COMMAND"
