name: ci

on:
  pull_request:
  workflow_dispatch: # pre-merge way to run the slow tests: run this workflow on a branch
  schedule:
    - cron: '43 4 * * 1' # weekly, on main
  push:
    branches:
      - main
      - 'work/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be publishing images.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv run python tools/check_adrs.py
      - run: uv run --with pyyaml python tools/check_registry.py
      # The core's currency table is generated from spec/currencies.yaml; fail
      # if the committed file is stale. Also runs locally as core:gen-currencies.
      - run: uv run tools/gen_currencies.py --check
      # The exponents must stay reproducible from the standard itself, not just
      # from this repo: fetch the pinned List One and re-derive the registry from
      # it, code by code. Weekly only, because it needs the network and because a
      # new publication upstream must not fail an unrelated PR. A failure means
      # either our registry drifted or SIX published a new list; both need a
      # human to look, and the fix is --transcribe, never a hand edit.
      - name: Currency registry is derivable from the pinned ISO 4217 publication
        if: github.event_name == 'schedule'
        run: |
          url="$(uv run --with pyyaml python -c 'import pathlib, yaml; print(yaml.safe_load(pathlib.Path("spec/currencies.source.yaml").read_text())["url"])')"
          curl -sSfL --retry 3 --max-time 60 -o "$RUNNER_TEMP/list-one.xml" "$url"
          uv run tools/gen_currencies.py --verify-source "$RUNNER_TEMP/list-one.xml"
      # check_vectors.py runs in python-ci as conformance:check.

  rust:
    uses: ./.github/workflows/rust-ci.yml

  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      include-slow: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/work/') || github.event_name == 'workflow_dispatch' }}

  go:
    uses: ./.github/workflows/go-ci.yml

  compose-boot:
    uses: ./.github/workflows/compose-boot.yml

  wheels:
    uses: ./.github/workflows/rust-wheels.yml

  images:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
