name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv run python tools/check_adrs.py
      - run: uv run --with pyyaml python tools/check_registry.py
      # check_vectors.py runs in python-ci as conformance:check.

  rust:
    uses: ./.github/workflows/rust-ci.yml

  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      include-slow: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  go:
    uses: ./.github/workflows/go-ci.yml

  compose-boot:
    uses: ./.github/workflows/compose-boot.yml

  wheels:
    uses: ./.github/workflows/rust-wheels.yml

  images:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
