# Lockstep releases. release-please keeps a release PR open on main; merging it
# creates the tag, and this workflow then builds the wheels, publishes hephkit
# to PyPI by trusted publishing (OIDC, no token anywhere), and pushes signed
# images with the release version as an extra tag.
#
# Needs, on the user's side (not done by this repo): a PyPI pending trusted
# publisher for project hephkit, owner Neoforge-Labs, repo hephaestus,
# workflow release.yml. Until it exists the publish job fails at the token
# exchange; nothing else in this file depends on it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# `major-tag` force-moves shared aliases, so two releases running at once could
# interleave and leave an alias on the older tag. Serialise on the ref, and do
# NOT cancel in progress: a cancelled release run leaves a tag cut with its
# wheels unpublished and its aliases unmoved, which is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      # Unprefixed outputs exist only for the root package ("."), which cuts
      # the plain vX.Y.Z tag. linked-versions keeps every package equal.
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Checked here rather than discovered inside the action. release-please
      # does a lot of work before it writes anything, so a token that cannot
      # write surfaces as "Resource not accessible by integration" at the very
      # end, pointing at a REST endpoint rather than at the cause. What this
      # now proves is the SETTING, not a secret: GITHUB_TOKEN's permissions
      # come from the permissions: block above, but only up to the ceiling set
      # by the repository, the organisation and the enterprise, any of which
      # can pin workflows to read-only and silently take the write back.
      - name: Require a release token that can actually write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=The workflow token is empty::GITHUB_TOKEN was not provided to this step, which should not happen in a normal Actions run."
            exit 1
          fi
          if [ -z "${GITHUB_RUN_ID:-}" ] || [ -z "${GITHUB_RUN_ATTEMPT:-}" ] || [ -z "${GITHUB_SHA:-}" ]; then
            echo "::error title=Cannot name a probe ref::GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT and GITHUB_SHA must all be set. The probe ref is named from the run and attempt so that it cannot collide with another run; without them it would have to use a shared name."
            exit 1
          fi
          # Readable at all? This separates "the token cannot see the
          # repository" from "it can see it but cannot write", which need
          # different fixes. It deliberately does NOT read `.permissions.push`:
          # that field is the authenticated USER's role, so a fine-grained PAT
          # whose owner has push access reports true while holding no
          # Contents: write. Release run 42117513449 failed twice behind
          # exactly that false assurance.
          seen=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.full_name' 2>&1) || {
            echo "::error title=The workflow token cannot read this repository::gh api said: ${seen}. This is not a permissions ceiling, which affects writes rather than reads, so treat it as an Actions or API fault rather than a setting."
            exit 1
          }
          # Prove the capability by performing it: create a git ref with this
          # token, which is what release-please does to open its release
          # branch, then delete it. The name carries the run id (unique per
          # workflow run, so concurrent runs differ) and the attempt (so a
          # re-run differs from its first attempt). It is not under work/**,
          # the only branch prefix ci.yml triggers on.
          probe="release-preflight-probe/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          attempted=0
          created=0
          # Runs on every way out of the step: success, failure, set -e, and
          # INT/TERM (a cancelled run). A delete that fails is reported but
          # never changes the exit status, so it can neither mask a refused
          # create nor fail a token that has just proved it can write. If
          # nothing was created the delete is still attempted, silently,
          # because a create that errors on the wire may have landed; a 404 or
          # 422 there is expected.
          cleanup() {
            status=$?
            if [ "$attempted" = 1 ]; then
              if gone=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${probe}" 2>&1); then
                :
              elif [ "$created" = 1 ]; then
                echo "::warning title=Probe branch was not deleted::Could not delete refs/heads/${probe} from ${GITHUB_REPOSITORY}: ${gone}. It is harmless but should be removed by hand."
              fi
            fi
            rm -f "${errfile:-}"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          attempted=1
          # stdout (the sha we compare) and stderr (diagnostics) are kept apart
          # so log noise on a successful call cannot read as a wrong sha.
          errfile=$(mktemp)
          got=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/heads/${probe}" -f "sha=${GITHUB_SHA}" --jq '.object.sha' 2>"$errfile") || {
            got="$(cat "$errfile")"
            echo "::error title=Workflow write permissions are disabled::Creating refs/heads/${probe} in ${GITHUB_REPOSITORY} failed: ${got}. release-please must create a branch and open a pull request, so workflows need write permissions AND permission to create pull requests. That is three settings, and the lowest one wins: check the repository, then the organisation, then the enterprise, at Settings -> Actions -> General -> Workflow permissions. Read them with: gh api repos/${GITHUB_REPOSITORY}/actions/permissions/workflow"
            exit 1
          }
          created=1
          if [ "$got" != "$GITHUB_SHA" ]; then
            echo "::error title=The workflow token created a ref that points elsewhere::Asked for refs/heads/${probe} at ${GITHUB_SHA} but the API reported '${got}'. The preflight will not vouch for a token whose result is not what release-please relies on."
            exit 1
          fi
          # Says only what was proven. Pull requests: Read and write cannot be
          # probed without opening a PR, so it is not claimed here.
          echo "token can create refs in ${GITHUB_REPOSITORY}"
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The Actions token, now that it is allowed to open pull requests.
          # The first release run failed with "GitHub Actions is not permitted
          # to create or approve pull requests", and the workaround was a PAT —
          # which then failed three more times on organisation policy and token
          # permissions. The real cause was a setting: workflow permissions were
          # pinned read-only and PR creation disabled, at the enterprise, the
          # organisation and the repository. With those raised, GITHUB_TOKEN
          # does the job with nothing to approve, expire or rotate.
          #
          # The known cost: a pull request authored by GITHUB_TOKEN does not
          # trigger workflows, so the release PR arrives with no checks
          # reported. That is accepted here — it is a version-bump and
          # changelog PR whose contents are generated from the commits CI
          # already ran on, and a release that never opens is worse than one
          # that opens unchecked.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Fail closed: this path cannot be exercised before a real release, so an
  # empty version must stop everything rather than ship an untagged image.
  verify-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a non-empty version and tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$TAG" ]; then
            echo "::error::release-please reported a release but version='$VERSION' tag='$TAG'"
            exit 1
          fi

  # Two major aliases, because the repo is consumed two ways and neither is
  # created by release-please. Reusable workflows resolve `...@v0` from the
  # plain `v0` tag; the Go submodule resolves only from the `go/` prefixed
  # tags this repo's release config cuts (component "go", tag-separator "/"),
  # so `go install .../go/cmd/heph@v0` needs `go/v0`. One job for both, so
  # contents: write is granted once and in one place.
  major-tag:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Force-move the major alias tags
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          git tag -f "$major"
          git tag -f "go/$major"
          # One push for both refs: the pair moves together or neither does,
          # so a half-moved pair cannot be left behind by a partial failure.
          git push --force origin "refs/tags/$major" "refs/tags/go/$major"

  wheels:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    uses: ./.github/workflows/rust-wheels.yml

  pypi:
    needs: wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing; there is deliberately no API token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  images:
    needs: [release-please, verify-release]
    if: ${{ needs.release-please.outputs.released == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      push: true
      version-tag: ${{ needs.release-please.outputs.version }}
