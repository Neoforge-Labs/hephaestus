# Reusable image pipeline for heph-python and heph-node.
#
# scan (always): build each image natively on amd64 and arm64 runners, run the
#   image contract tests (moon run docker:test), then Trivy with the gate
#   below. Fails the build on a fixable HIGH/CRITICAL finding.
# publish (only when inputs.push): multi-arch push to GHCR, Syft SBOM attested
#   to the image, keyless cosign signature. Callers pass push only for main
#   and releases.
#
# The Trivy gate uses --ignore-unfixed: both images carry Debian CVEs that have
# no fixed package yet (documented in docker/TRIVY_EXCEPTIONS.md). Without it a
# correct image exits 1 forever and the gate would have to be switched off.
#   uses: Neoforge-Labs/hephaestus/.github/workflows/docker-publish.yml@v0
name: docker-publish

on:
  workflow_call:
    inputs:
      push:
        description: Publish, SBOM and sign (main and releases only).
        type: boolean
        default: false
      version-tag:
        description: Extra image tag, e.g. the release version. Optional.
        type: string
        default: ''
      tag-prefix:
        description: >-
          Prefix for the sha tag, so a caller's images are distinguishable in
          the registry. ci.yml passes "ci-" for the images it publishes from
          main; release.yml passes nothing, so a released image's sha tag is
          bare and sits alongside its version tag.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scan:
    name: build, test, scan (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # moon compares against the base branch on a pull_request. A shallow
          # clone has no merge base to resolve, so its git call fails with exit
          # 128 (it only warns on push, where there is no explicit base).
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
      - name: Build and test both images
        run: moon run docker:test
      - name: Trivy, heph-python
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heph-python:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy, heph-node
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heph-node:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    if: ${{ inputs.push }}
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign
    strategy:
      fail-fast: false
      matrix:
        image: [python, node]
    env:
      IMAGE: ghcr.io/neoforge-labs/heph-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # moon compares against the base branch on a pull_request. A shallow
          # clone has no merge base to resolve, so its git call fails with exit
          # 128 (it only warns on push, where there is no explicit base).
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute tags
        id: tags
        env:
          VERSION_TAG: ${{ inputs.version-tag }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          tags="$IMAGE:${TAG_PREFIX}sha-${GITHUB_SHA::12}"
          if [ -n "$VERSION_TAG" ]; then tags="$tags,$IMAGE:$VERSION_TAG"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Syft SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact-retention: 90
      - name: Sign image and attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.image }}.spdx.json" "$IMAGE@$DIGEST"
