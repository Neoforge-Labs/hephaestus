[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hephkit-lab"
version = "0.1.0"
description = "Hephaestus research core: run records, replay-and-diff, frozen inputs and CI gates over hephkit (experimental)"
requires-python = ">=3.12"
license = { text = "MIT" }
# The whole integrity spine -- config, repro, record, replay, gates -- installs
# with no scientific stack at all (ADR 0023). Everything heavy is an extra
# below. `tests/test_package.py::test_spine_declares_no_heavy_dependencies`
# fails if anything else is added here.
dependencies = ["hephkit>=0.3", "pydantic>=2.9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

# The extras partition of design section 7.1.2. A non-ML project must not pay
# for an ML stack, and a non-bio project must not pay for a bio engine.
[project.optional-dependencies]
track = ["mlflow>=3.0"]
data = ["dvc>=3.60", "polars>=1.20", "duckdb>=1.1"]
causal = ["dowhy>=0.13", "causal-learn>=0.1.4", "causalphylo>=0.1"]
stats = ["scipy>=1.14"]
ml = ["torch>=2.6", "accelerate>=1.0", "safetensors>=0.5", "transformers>=4.50"]
flows = ["prefect>=3.2"]
notebook = ["marimo>=0.14"]
bio = ["ligase-bio>=0.4"]
all = [
    "hephkit-lab[track]",
    "hephkit-lab[data]",
    "hephkit-lab[causal]",
    "hephkit-lab[stats]",
    "hephkit-lab[ml]",
    "hephkit-lab[flows]",
    "hephkit-lab[notebook]",
    "hephkit-lab[bio]",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11"]

# `hephkit` is not on PyPI at 0.3 yet, and the development loop must resolve the
# portion in this repository in any case: an editable install of each portion is
# the layout design section 7.1.3's typing finding was established against.
[tool.uv.sources]
hephkit = { path = "../hephkit", editable = true }

# This distribution ships `hephkit/lab/` and nothing else. Naming the subpackage
# rather than `src/hephkit` is what guarantees no `hephkit/__init__.py` and no
# `hephkit/py.typed` can ever reach the wheel: either would be a file two
# distributions own in a merged `pip install` layout (ADR 0021, ADR 0023).
[tool.hatch.build.targets.wheel]
only-include = ["src/hephkit/lab"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Registered for parity with `hephkit`, whose `test-fast` task deselects it. No
# lab test is slow yet; the marker exists so the two task sets stay identical.
markers = ["slow: long-running tests; deselect with -m 'not slow'"]
filterwarnings = ["error"]

[tool.coverage.run]
# `hephkit.lab` rather than `hephkit`: the sibling portion is installed editable
# into this environment, and measuring it here would report another
# distribution's coverage against this one's gate.
source = ["hephkit.lab"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
python_version = "3.12"
# `hephkit` is a PEP 420 namespace package (ADR 0021), so `src/hephkit/` has no
# __init__.py to anchor the package root and `mypy --strict src` would otherwise
# reach each file under two module names. Naming one explicit base resolves
# every file to `hephkit.lab.*`. The path is config-relative, not cwd-relative,
# so running mypy from the repository root cannot break it.
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
