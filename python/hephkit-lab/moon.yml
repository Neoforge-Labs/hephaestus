language: 'python'
layer: 'library'

tasks:
  test:
    # No maturin step: there is no Rust in this distribution. `uv run` syncs the
    # environment, which builds the editable `hephkit` portion from
    # `../hephkit` -- that one does compile the PyO3 extension.
    # The coverage gate lives here and in `test-fast`, never in `test-spine`: the
    # gate measures code, and `lab.data.frames` can only execute where polars
    # and duckdb import. The extras this wave's code reaches for -- `data`
    # (polars, duckdb, pyarrow, dvc) and `stats` (scipy, numpy) -- are installed
    # so it is measured. `causal` is not: nothing on this branch imports dowhy,
    # causal-learn or causalphylo, and the task that adds `lab.causal` brings the
    # extra back here beside the licence gate that guards it.
    script: 'uv run --extra data --extra stats pytest --cov=hephkit.lab --cov-fail-under=90'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'pyproject.toml'
      - '/python/hephkit/src/**/*'
      - '/python/hephkit/pyproject.toml'
      - '/core/hephkit-core/**/*'
      - '/core/hephkit-py/**/*'
  test-fast:
    # CI default, mirroring `hephkit:test-fast`: everything except the
    # `slow`-marked tests. No lab test is slow yet; the deselection is here so
    # the two task sets stay identical as the suite grows.
    script: 'uv run --extra data --extra stats pytest -m "not slow" --cov=hephkit.lab --cov-fail-under=90'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'pyproject.toml'
      - '/python/hephkit/src/**/*'
      - '/python/hephkit/pyproject.toml'
      - '/core/hephkit-core/**/*'
      - '/core/hephkit-py/**/*'
  test-spine:
    # The spine alone: no extras, in an environment of its own, with the tests
    # that need a library deselected. `--exact` and a separate environment are
    # what make this a proof: the shared `.venv` holds every extra, and a plain
    # `uv run` would leave them importable. No coverage gate here -- the code
    # behind an extra cannot run, so a percentage would measure the wrong thing.
    script: 'uv run --exact pytest -m "not extras"'
    env:
      UV_PROJECT_ENVIRONMENT: '.venv-spine'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'pyproject.toml'
      - '/python/hephkit/src/**/*'
      - '/python/hephkit/pyproject.toml'
      - '/core/hephkit-core/**/*'
      - '/core/hephkit-py/**/*'
  typecheck:
    # The same extras as `test` and `test-fast` (`data` and `stats`, not
    # `causal`), and for two reasons. Moon runs
    # these tasks concurrently against the one shared `.venv`; a plain `uv run`
    # here would sync it to a different set than they do, and either side could
    # resync it out from under the other. And mypy then checks `lab.data.frames`
    # against the real polars and duckdb rather than through the
    # ignore-missing-imports overrides.
    command: 'uv run --extra data --extra stats mypy --strict src'
    inputs:
      - 'src/**/*'
      - 'pyproject.toml'
      - '/python/hephkit/src/**/*'
      # The sibling portion's own `[tool.mypy]` and its `py.typed` placement
      # decide whether `hephkit.*` resolves typed from here, so a change to it
      # must invalidate this cache as it does the test tasks'.
      - '/python/hephkit/pyproject.toml'
