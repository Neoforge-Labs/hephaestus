[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hephkit"
version = "0.3.0"
description = "Hephaestus correctness kit: money, canonical JSON, content hashing and webhook signatures over the Rust core (experimental)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
settings = ["pydantic-settings>=2.6"]
postgres = ["asyncpg>=0.30"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]
observability = [
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[tool.maturin]
python-source = "src"
module-name = "hephkit._core"
manifest-path = "../../core/hephkit-py/Cargo.toml"
features = ["pyo3/extension-module"]
# schema.sql is the one copy of the idempotency DDL; the wheel must ship it.
include = [{ path = "src/hephkit/idempotency/*.sql", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: multi-megabyte inputs; deselect with -m 'not slow'"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["hephkit"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
python_version = "3.12"
# `hephkit` is a PEP 420 namespace package (ADR 0024), so `src/hephkit/` has no
# __init__.py to anchor the package root. Without these two settings, checking a
# path (`mypy --strict src`, the command CLAUDE.md mandates) makes mypy take
# `src/hephkit` as a package base too and reach the same file under two module
# names -- "Source file found twice under different module names". Naming `src`
# as the one explicit base resolves every file to `hephkit.*` and nothing else.
mypy_path = "src"
explicit_package_bases = true

# asyncpg ships no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
