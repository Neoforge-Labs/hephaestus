language: 'python'
layer: 'library'

tasks:
  test:
    script: 'uv run maturin develop --uv && uv run pytest --cov=hephkit --cov-fail-under=90'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'pyproject.toml'
      - '/core/hephkit-core/**/*'
      - '/core/hephkit-py/**/*'
      - '/conformance/**/*.json'
  typecheck:
    command: 'uv run mypy --strict src'
    inputs:
      - 'src/**/*'
      - 'pyproject.toml'

  core-codes:
    # Every code exposed by the Rust core must be in spec/errors.yaml, and the
    # real-core test (skipped in a bare tools environment) must actually run.
    script: 'uv run maturin develop --uv && uv run --with pyyaml python ../../tools/check_core_codes.py && uv run --with pyyaml --with pytest pytest -rs ../../tools/tests/test_check_core_codes.py'
    inputs:
      - '/spec/errors.yaml'
      - '/tools/check_core_codes.py'
      - '/tools/check_registry.py'
      - '/tools/tests/test_check_core_codes.py'
      - '/core/hephkit-py/**/*'
      - '/core/hephkit-core/**/*'

  gen-errors:
    # _codes.py is generated from spec/errors.yaml; fail if the committed file is stale.
    command: 'uv run ../../tools/gen_errors.py --check'
    inputs:
      - '/spec/errors.yaml'
      - '/tools/gen_errors.py'
      - '/tools/check_registry.py'
      - 'src/hephkit/errors/_codes.py'

  gen-conventions:
    # conventions.py is generated from conventions/attributes.yaml; fail if the committed file is stale.
    command: 'uv run ../../tools/gen_conventions.py --check'
    inputs:
      - '/conventions/attributes.yaml'
      - '/tools/gen_conventions.py'
      - '/tools/check_registry.py'
      - 'src/hephkit/conventions.py'
