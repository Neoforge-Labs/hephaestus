$schema: 'https://moonrepo.dev/schemas/workspace.json'

# moon rejects project paths that do not exist yet, so only projects present on
# disk are listed. Each later task adds its own entry beside its moon.yml:
#   heph-cli: 'go'
#   docker: 'docker'
#   compose: 'compose'
projects:
  conformance: 'conformance'
  core: 'core'
  hephkit: 'python/hephkit'
  hephkit-lab: 'python/hephkit-lab'
  spec: 'spec'
  docker: 'docker'
  compose: 'compose'
  docs-site: 'docs/site'
  heph-cli: 'go'
  examples-hello: 'examples/hello'

vcs:
  client: 'git'
  defaultBranch: 'main'
