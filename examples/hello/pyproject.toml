[project]
name = "hello"
version = "0.0.0"
description = "The five-minute Hephaestus example: money on the wire, with traces."
requires-python = ">=3.12"
dependencies = [
    # The extras the tutorial installs, and the reason the tutorial's command
    # names them: the app needs the FastAPI error handlers and the OTEL wiring,
    # neither of which ships in the base package.
    "hephkit[fastapi,observability,settings]>=0.2",
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# app.py sits at the example's root, beside this file, so the tutorial can run
# `fastapi dev app.py`. Put that root on the path for the tests too.
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]
