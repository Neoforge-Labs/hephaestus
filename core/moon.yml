language: 'rust'
layer: 'library'

tasks:
  test:
    command: 'cargo test -p hephkit-core'
    inputs:
      - 'hephkit-core/**/*'
      - 'Cargo.toml'
      - '/conformance/money/*.json'
  lint:
    command: 'cargo clippy -p hephkit-core --all-targets -- -D warnings'
    inputs:
      - 'hephkit-core/**/*'
      - 'Cargo.toml'

  lint-py:
    command: 'cargo clippy -p hephkit-py --all-targets -- -D warnings'
    inputs:
      - 'hephkit-py/**/*'
      - 'hephkit-core/**/*'
      - 'Cargo.toml'
  gen-currencies:
    # currency_table.rs is generated from spec/currencies.yaml; fail if the committed file is stale.
    command: 'uv run ../tools/gen_currencies.py --check'
    inputs:
      - '/spec/currencies.yaml'
      - '/spec/currencies.source.yaml'
      - '/tools/gen_currencies.py'
      - '/tools/check_registry.py'
      - 'hephkit-core/src/money/currency_table.rs'
  coverage:
    # Needs the rustup toolchain with llvm-tools and cargo-llvm-cov; a Homebrew
    # cargo has no llvm-profdata.
    command: 'cargo llvm-cov -p hephkit-core --fail-under-lines 90'
    inputs:
      - 'hephkit-core/**/*'
      - 'Cargo.toml'
      - '/conformance/**/*.json'
    options:
      cache: false
