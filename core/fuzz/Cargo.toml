[package]
name = "hephkit-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hephkit-core = { path = "../hephkit-core" }

# Detached from the core/ workspace: fuzzing needs nightly.
[workspace]

[[bin]]
name = "money_parse"
path = "fuzz_targets/money_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_header"
path = "fuzz_targets/signature_header.rs"
test = false
doc = false
bench = false
